name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build + vet + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  verify:
    name: gödel verify (format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # A serial download before godel's own lint task, which runs several analyzers concurrently:
      # on the first-ever CI run (cold module cache, no restore available), concurrent extraction of
      # the same module from multiple linters raced and left one package unresolved
      # ("undefined: werror" across every conjure-generated file importing witchcraft-go-error),
      # reproduced identically on a retry (setup-go's cache-save post-step is skipped on job
      # failure, so every retry was equally cold) but never locally, where the module cache is warm.
      - run: go mod download
      - run: ./godelw verify --skip-test

  web:
    name: web/apps/${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: web/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sdk-verify:
    name: TS SDK matches the Conjure contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make sdk-verify
