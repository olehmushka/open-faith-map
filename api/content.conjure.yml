# Content module API (M3, POST/EVENT enabled at M4). docs/modules/content.md. OpenFaithMap's own
# schema — a congregation's website: pages, posts, and events, each made of typed, schema-validated
# blocks.
#
# content.manage is a target-scoped capability check (internal/authz.Require with
# PermContentManage, unitID: the SITE's own congregation unit — never a shared root). As of M14.9
# (D-TenantSubdomains' U16 ruling) it is its own grantable permission code, not a byproduct of
# religionorg.manage's subtree grant — see content.md's authorization-touchpoints section.
#
# TWO services share this file's types because Conjure's auth is a fixed per-service choice
# (header/cookie), not a runtime-conditional one — there is no way for one endpoint to require a
# token only when the caller happens to send one. openfaithmap-web holds no session at all
# (D-AdminSurface), so it can only ever call ContentPublicService; ContentService is
# openfaithmap-admin only.
#
# Generated Go lands in internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: openfaithmap.content
    objects:
      DocumentKind:
        values:
          - PAGE
          - POST
          - EVENT
      DocumentState:
        values:
          - DRAFT
          - PUBLISHED
          - UNLISTED
      DocumentTransitionAction:
        values:
          - PUBLISH
          - UNLIST
          - REVERT_TO_DRAFT
      BlockTypeStatus:
        values:
          - ACTIVE
          - RETIRED

      Site:
        fields:
          id: string
          congregationUnitId:
            type: string
            docs: The directory_units RID this site belongs to (opaque value).
          slug: string
          theme:
            type: any
            docs: Accent color, font pairing, header layout — data, never a per-tenant code fork.
          logoUrl:
            type: optional<string>
            docs: M14.11. content_sites' own setting — never a content document.
          socialLinks:
            type: SocialLinks
            docs: M14.11. content_sites' own setting — never a content document.
          createdAt: datetime
          updatedAt: datetime
      SocialLinks:
        fields:
          facebook: optional<string>
          instagram: optional<string>
          youtube: optional<string>
          twitter: optional<string>
          website: optional<string>
      CreateSiteRequest:
        fields:
          congregationUnitId: string
          slug:
            type: string
            docs: Admin-chosen, probed for uniqueness at write time (U5) — Content:SlugTaken on collision.
      UpdateSiteThemeRequest:
        fields:
          theme: any
      UpdateSiteChromeRequest:
        fields:
          logoUrl: optional<string>
          socialLinks: SocialLinks
      ServiceSchedule:
        docs: >
          M14.11. One religion_service_schedules row, read live and composed into SiteChrome —
          never copied into content's own tables (docs/modules/content.md's standing invariant).
        fields:
          dayOfWeek: optional<integer>
          rrule: optional<string>
          startTime:
            type: optional<string>
            docs: "\"HH:MM\", 24h. Absent for an rrule-only schedule."
          endTime: optional<string>
          timezone: string
          language: optional<string>
          mode: string
          meetingUrl: optional<string>
          description: optional<string>
      SiteChrome:
        docs: >
          M14.11's header/footer bundle, fetched once by the tenant layout. logoUrl/socialLinks are
          content_sites' own persisted settings; congregationName/address/schedules are composed
          live from religion_sites/religion_service_schedules at read time — never copied here.
        fields:
          congregationName: string
          address:
            type: optional<string>
            docs: Coarsened per the religion site's own publish precision; absent if hidden or unset.
          logoUrl: optional<string>
          socialLinks: SocialLinks
          schedules: list<ServiceSchedule>

      Document:
        fields:
          id: string
          siteId: string
          kind: DocumentKind
          translationGroupId:
            type: string
            docs: Shared across every locale variant of one conceptual document.
          locale: string
          parentDocumentId:
            type: optional<string>
            docs: Pages only, up to 3 levels deep (app-enforced, not a DB constraint).
          slug: string
          state: DocumentState
          publishedAt: optional<datetime>
          eventStartsAt: optional<datetime>
          eventEndsAt: optional<datetime>
          eventRecurrenceRrule: optional<string>
          createdAt: datetime
          updatedAt: datetime
      CreateDocumentRequest:
        fields:
          kind:
            type: DocumentKind
            docs: EVENT requires eventStartsAt to be set (Content:EventMissingStart otherwise).
          translationGroupId:
            type: optional<string>
            docs: Omit to start a new translation group; set to join an existing one as another locale variant.
          locale: string
          parentDocumentId: optional<string>
          slug: string
          eventStartsAt:
            type: optional<datetime>
            docs: EVENT only. Required when kind is EVENT; ignored for PAGE/POST.
          eventEndsAt: optional<datetime>
          eventRecurrenceRrule: optional<string>
      UpdateDocumentRequest:
        fields:
          slug: optional<string>
          parentDocumentId:
            type: optional<string>
            docs: Set a new parent. Omit (with clearParent false) to leave the parent unchanged.
          clearParent:
            type: boolean
            docs: Set true (with parentDocumentId omitted) to move the page to top level.
      TransitionDocumentRequest:
        fields:
          action: DocumentTransitionAction
      DocumentPage:
        fields:
          documents: list<Document>

      Block:
        fields:
          id: string
          documentId: string
          blockTypeCode: string
          position: integer
          data: any
          createdAt: datetime
          updatedAt: datetime
      BlockInput:
        fields:
          blockTypeCode: string
          position: integer
          data: any
      PutBlocksRequest:
        fields:
          blocks: list<BlockInput>
      BlockList:
        fields:
          blocks: list<Block>

      DocumentRevision:
        docs: >
          One entry in a document's revision history (M14.6, D-ContentRevisions) — always a past
          checkpoint created at publish time, never the in-progress draft (listRevisions excludes
          it). Carries no blocks data: history is a timestamped list to restore from, not a diff
          viewer.
        fields:
          revisionId: string
          revisionNo: integer
          createdAt: datetime
          authorPersonId: optional<string>
          label: optional<string>
      RevisionPage:
        fields:
          revisions: list<DocumentRevision>

      BlockType:
        fields:
          id: string
          code: string
          name: string
          jsonSchema: any
          uiSchema: any
          status: BlockTypeStatus
          sortOrder: integer
      BlockTypePage:
        fields:
          blockTypes: list<BlockType>

      PreviewLink:
        docs: >
          M14.7. token is a short-lived, stateless, site-scoped signed token — opaque to the
          caller, verified by ContentPublicService's preview endpoints, never a session or a
          revocable row (see D-ContentRevisions).
        fields:
          token: string

      NavItem:
        docs: >
          M14.10. One entry in a site's hand-built nav menu — independent of
          parent_document_id (M14.0 replaced the page-tree-derived-nav assumption with a
          curated menu). Exactly one of targetDocumentId/targetUrl is ever set.
        fields:
          id: string
          siteId: string
          label: string
          targetDocumentId: optional<string>
          targetUrl: optional<string>
          sortOrder: integer
      NavItemInput:
        fields:
          label: string
          targetDocumentId: optional<string>
          targetUrl: optional<string>
          sortOrder: integer
      PutNavItemsRequest:
        fields:
          items: list<NavItemInput>
      NavItemList:
        fields:
          items: list<NavItem>

      PublicNavItem:
        docs: >
          M14.10. A nav item as read by openfaithmap-web: the target is already resolved into a
          ready-to-render href (an internal target's href walks its real ancestor chain into a
          hierarchical path — the caller never re-derives that), so this is a dumb render list. A
          nav item whose target document is missing or DRAFT is omitted from the list entirely,
          never surfaced as a broken link.
        fields:
          label: string
          href: string
          external: boolean
      PublicNavItemList:
        fields:
          items: list<PublicNavItem>

      DocumentWithAncestors:
        docs: >
          M14.10's page-route resolver: the leaf document plus its real ancestor chain (root
          first, leaf excluded), in one round trip, so the tenant-subdomain catch-all page route
          never needs a second call to render breadcrumbs.
        fields:
          document: Document
          ancestors: list<Document>

    errors:
      SiteNotFound:
        namespace: Content
        code: NOT_FOUND
        safe-args:
          siteId: string
      SlugTaken:
        docs: >
          U5's resolution: admin-chosen slug, probed for uniqueness at write time — no silent
          suffixing. scope is "site" (globally unique) or "document" (unique within site+kind+locale).
        namespace: Content
        code: CONFLICT
        safe-args:
          slug: string
          scope: string
      SlugReserved:
        docs: >
          D-TenantSubdomains' reserved-subdomain blocklist (M14.9) — content_sites.slug is a
          hostname component (<slug>.<apex>), so a fixed set of names can never be claimed,
          enforced server-side regardless of caller.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          slug: string
      DocumentNotFound:
        namespace: Content
        code: NOT_FOUND
        safe-args:
          documentId: string
      Forbidden:
        docs: The caller does not hold content.manage on this site's congregation unit.
        namespace: Content
        code: PERMISSION_DENIED
        safe-args: {}
      EventMissingStart:
        docs: kind=EVENT requires eventStartsAt to be set.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args: {}
      ParentTooDeep:
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          parentDocumentId: string
      InvalidTransition:
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          documentId: string
          fromState: string
          action: string
      BlockTypeNotFound:
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          blockTypeCode: string
      BlockDataInvalid:
        docs: >
          block.data failed json_schema validation for its block type. field is the failing
          top-level property name when it could be safely determined (never the raw validator
          message or an arbitrary submitted key — see blockvalidation.go), otherwise empty.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          blockTypeCode: string
          position: integer
          field: string
      DuplicateBlockPosition:
        docs: Two blocks in the same putBlocks call shared a position — rejected up front, no re-derivation.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          position: integer
      BlockUrlNotAllowed:
        docs: >
          A URL-bearing block field failed D-PublicSiteCSP's scheme/host allowlist (schemes:
          https, http, mailto, tel; embed hosts checked separately for social_embed).
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          blockTypeCode: string
          position: integer
          field: string
      ThemeInvalid:
        docs: >
          M14.12. A theme field's value is outside D-CuratedTheme's fixed vocabulary (never a raw
          hex/font — see themevalidation.go). field is the failing top-level property name when it
          could be safely determined, otherwise empty; never the raw submitted value.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          field: string
      ThemeContrastFailed:
        docs: >
          M14.12. The submitted accent/mode pair fails WCAG AA contrast (D-CuratedTheme's
          write-time gate) — both are curated token names, never a raw hex value.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          accent: string
          mode: string
      RevisionNotFound:
        docs: >
          M14.6. The revision id either doesn't exist or belongs to a different document —
          revisionId is never trusted to already be scoped to the documentId in the request path.
        namespace: Content
        code: NOT_FOUND
        safe-args:
          revisionId: string
      PreviewTokenInvalid:
        docs: >
          M14.7. Covers missing, malformed, expired, and wrong-site tokens alike — deliberately one
          error for all cases, mirroring Forbidden's empty safe-args, so a caller probing the
          preview endpoints learns nothing about which check failed or whether the site/document
          exists.
        namespace: Content
        code: PERMISSION_DENIED
        safe-args: {}
      NavTargetInvalid:
        docs: >
          M14.10. A nav item's targetDocumentId doesn't resolve to a PAGE document belonging to
          this same site.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          targetDocumentId: string
      NavTargetAmbiguous:
        docs: >
          M14.10. A nav item in one putNavItems call had neither or both of
          targetDocumentId/targetUrl set — exactly one is required.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          sortOrder: integer
      DuplicateNavItemSortOrder:
        docs: Two nav items in the same putNavItems call shared a sortOrder — rejected up front.
        namespace: Content
        code: INVALID_ARGUMENT
        safe-args:
          sortOrder: integer

services:
  ContentService:
    name: Content Service
    package: openfaithmap.content
    base-path: /content/v1
    default-auth: header
    docs: >
      Congregation site authoring: sites, documents (pages), blocks. Every write, and every read
      that must see draft state, is content.manage-gated — a live, target-scoped Authorize call
      against the site's own congregation unit (see file header). See docs/modules/content.md.
    endpoints:
      createSite:
        http: POST /sites
        args:
          request: CreateSiteRequest
        returns: Site
      updateSiteTheme:
        http: PUT /sites/{siteId}/theme
        args:
          siteId:
            type: string
            param-type: path
          request: UpdateSiteThemeRequest
        returns: Site
      updateSiteChrome:
        http: PUT /sites/{siteId}/chrome
        docs: M14.11. Full replace, same shape as updateSiteTheme — the admin form always submits the complete logoUrl/socialLinks pair.
        args:
          siteId:
            type: string
            param-type: path
          request: UpdateSiteChromeRequest
        returns: Site
      listDocuments:
        http: GET /sites/{siteId}/documents
        docs: Admin read — returns documents in every state.
        args:
          siteId:
            type: string
            param-type: path
          kind:
            type: optional<string>
            param-type: query
          locale:
            type: optional<string>
            param-type: query
          state:
            type: optional<string>
            param-type: query
        returns: DocumentPage
      createDocument:
        http: POST /sites/{siteId}/documents
        args:
          siteId:
            type: string
            param-type: path
          request: CreateDocumentRequest
        returns: Document
      updateDocument:
        http: PUT /documents/{documentId}
        args:
          documentId:
            type: string
            param-type: path
          request: UpdateDocumentRequest
        returns: Document
      transitionDocument:
        http: POST /documents/{documentId}/transition
        args:
          documentId:
            type: string
            param-type: path
          request: TransitionDocumentRequest
        returns: Document
      getBlocks:
        http: GET /documents/{documentId}/blocks
        docs: Admin read — works regardless of document state.
        args:
          documentId:
            type: string
            param-type: path
        returns: BlockList
      putBlocks:
        http: PUT /documents/{documentId}/blocks
        docs: >
          Full replace of the draft revision's blocks, validated against each referenced block
          type's json_schema (M14.6: this writes the draft only — never what's published — so this
          one endpoint serves both the editor's manual save and its debounced autosave).
        args:
          documentId:
            type: string
            param-type: path
          request: PutBlocksRequest
        returns: BlockList
      listRevisions:
        http: GET /documents/{documentId}/revisions
        docs: History list (M14.6) — every past checkpoint, newest first, excluding the draft itself.
        args:
          documentId:
            type: string
            param-type: path
        returns: RevisionPage
      restoreRevision:
        http: POST /documents/{documentId}/revisions/{revisionId}/restore
        docs: >
          Copies a past checkpoint's blocks into the draft — into the draft only, never
          auto-publishing (owner decision, 2026-08-28). Publish afterward to make it live.
        args:
          documentId:
            type: string
            param-type: path
          revisionId:
            type: string
            param-type: path
        returns: BlockList
      createPreviewLink:
        http: POST /sites/{siteId}/preview-link
        docs: >
          M14.7. Mints a short-lived, site-scoped preview token — content.manage-gated, same as
          every other write/draft-read on this service. The returned token is handed to
          ContentPublicService's preview endpoints on the tenant subdomain, never used here again.
        args:
          siteId:
            type: string
            param-type: path
        returns: PreviewLink
      listNavItems:
        http: GET /sites/{siteId}/nav-items
        docs: M14.10. Admin read of the site's nav menu, in sortOrder.
        args:
          siteId:
            type: string
            param-type: path
        returns: NavItemList
      putNavItems:
        http: PUT /sites/{siteId}/nav-items
        docs: >
          M14.10. Full replace of the site's nav menu — a small, hand-curated list edited as a
          batch, the same shape putBlocks used before M14.6's revision refactor moved it to an
          in-place update. Content:DuplicateNavItemSortOrder if two items share a sortOrder,
          Content:NavTargetAmbiguous if an item has neither or both of
          targetDocumentId/targetUrl, Content:NavTargetInvalid if targetDocumentId doesn't
          resolve to a PAGE document in this same site.
        args:
          siteId:
            type: string
            param-type: path
          request: PutNavItemsRequest
        returns: NavItemList

  ContentPublicService:
    name: Content Public Service
    package: openfaithmap.content
    base-path: /content/v1/public
    docs: >
      Anonymous reads only (openfaithmap-web holds no session — D-AdminSurface). Always filters to
      published/unlisted; never discloses draft documents or their blocks — with exactly one
      carve-out, M14.7's listPreviewDocuments/getPreviewBlocks, which require a valid site-scoped
      preview token (minted by ContentService.createPreviewLink) in place of a session, since this
      service's caller never holds one.
    endpoints:
      getSite:
        # Deliberately NOT /sites/{congregationUnitId} — that shares this service's /sites/{siteId}/...
        # wildcard tree position under a differently-named parameter, which witchcraft's underlying
        # httprouter rejects at startup (two routes cannot share a wildcard slot with different
        # parameter names, regardless of what follows). Found by actually booting the server, not by
        # review — content.md's original sketch had the same latent conflict.
        http: GET /units/{congregationUnitId}/site
        args:
          congregationUnitId:
            type: string
            param-type: path
        returns: Site
      getSiteBySlug:
        docs: >
          M14.9: the tenant-subdomain proxy resolves a Host header's slug through this endpoint. A
          distinct top-level path (not nested under /sites/{siteId}/...) — same httprouter
          wildcard-slot conflict getSite's own comment above documents.
        http: GET /site-by-slug/{slug}
        args:
          slug:
            type: string
            param-type: path
        returns: Site
      getSiteChrome:
        docs: >
          M14.11. The tenant layout's one call for header/footer data — logoUrl/socialLinks from
          content_sites, congregationName/address/schedules composed live from religion at read
          time. No auth, same anonymous shape as getSite/getSiteBySlug.
        http: GET /sites/{siteId}/chrome
        args:
          siteId:
            type: string
            param-type: path
        returns: SiteChrome
      listPublicDocuments:
        http: GET /sites/{siteId}/documents
        args:
          siteId:
            type: string
            param-type: path
          kind:
            type: optional<string>
            param-type: query
          locale:
            type: optional<string>
            param-type: query
        returns: DocumentPage
      getPublicBlocks:
        http: GET /documents/{documentId}/blocks
        docs: Content:DocumentNotFound if the document is draft or doesn't exist — never distinguishes the two.
        args:
          documentId:
            type: string
            param-type: path
        returns: BlockList
      listPreviewDocuments:
        http: GET /sites/{siteId}/preview-documents
        docs: >
          M14.7. Like listPublicDocuments, but returns documents in every state (draft included) —
          gated by token (from createPreviewLink) instead of published/unlisted filtering.
          Content:PreviewTokenInvalid if the token is missing, malformed, expired, or scoped to a
          different site.
        args:
          siteId:
            type: string
            param-type: path
          token:
            type: string
            param-type: query
          kind:
            type: optional<string>
            param-type: query
          locale:
            type: optional<string>
            param-type: query
        returns: DocumentPage
      getPreviewBlocks:
        http: GET /documents/{documentId}/preview-blocks
        docs: >
          M14.7. Reads the document's draft revision regardless of its published state — gated by
          token (from createPreviewLink) instead of a session. Content:PreviewTokenInvalid if the
          token is missing, malformed, expired, or scoped to a different site than the document's
          own.
        args:
          documentId:
            type: string
            param-type: path
          token:
            type: string
            param-type: query
        returns: BlockList
      listBlockTypes:
        http: GET /block-types
        docs: Active block types only.
        returns: BlockTypePage
      listPublicNavItems:
        http: GET /sites/{siteId}/nav-items
        docs: >
          M14.10. Resolved hrefs, in sortOrder — see PublicNavItem's own docs for the
          omit-on-missing-or-draft-target behavior.
        args:
          siteId:
            type: string
            param-type: path
        returns: PublicNavItemList
      getPublicDocumentByPath:
        http: GET /sites/{siteId}/documents/by-path
        docs: >
          M14.10. Resolves the leaf PAGE document (by locale + slug) plus its real ancestor
          chain, for the tenant-subdomain catch-all page route. path is a slash-joined, ordered
          list of slug segments (e.g. "parent-slug/child-slug"); every segment must match the
          document's real parent_document_id chain positionally — a mismatch at any position
          (including the leaf's own slug) 404s exactly like a wrong slug would, never resolving
          by the last segment alone. Content:DocumentNotFound if the leaf doesn't exist, isn't a
          PAGE, is DRAFT, or the ancestor chain doesn't match — one error for every case, same
          discipline as getPublicBlocks.
        args:
          siteId:
            type: string
            param-type: path
          locale:
            type: string
            param-type: query
          path:
            type: string
            param-type: query
        returns: DocumentWithAncestors
