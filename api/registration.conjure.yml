# Registration module API (M2). docs/modules/registration.md. OpenFaithMap's own schema — the first
# in openfaithmap-api — holding pending congregation-registration requests until a registration
# operator (a person holding religionorg.manage on the shared root unit, verified live against
# internal/authz's PDP — never cached, D-InProcessAuthz's amendment) approves or rejects one.
#
# Approval performs the real in-process core writes (createChildOrg, setOrgProfile classification,
# createSite over a new location, createPosition/fillPosition, grantAssignment) under the OPERATOR'S
# own resolved subject (authz.Require, not a parameter — the same defect class fixed at M2.3/M3);
# internal/authz's PDP decides for real, same as every other write in this project.
#
# Generated Go lands in internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: openfaithmap.registration
    objects:
      RegistrationStatus:
        values:
          - PENDING
          - PROVISIONING
          - APPROVED
          - REJECTED
      ReparentStatus:
        docs: >
          The state machine for re-parenting an already-APPROVED request's congregation unit onto a
          different jurisdiction unit (M4.1). AddEdge+RemoveEdge on the canonical directory graph is
          two non-transactional calls, not one atomic move — this tracks which one durably landed so
          a retry resumes rather than repeats. Add-before-remove by design: the congregation briefly
          has two canonical parents mid-migration rather than momentarily zero, so no subtree-scoped
          grant (registration-operator, platform-moderator) loses reach to it during the move.
        values:
          - PENDING
          - NEW_EDGE_ADDED
          - OLD_EDGE_REMOVED
          - VERIFIED
          - FAILED
      Coordinate:
        docs: WGS84 latitude/longitude for the congregation's site.
        fields:
          latitude: double
          longitude: double
      RegistrationRequest:
        fields:
          id:
            type: string
            docs: OpenFaithMap-local RID (openfaithmap.registration.request).
          submittedByPersonId:
            type: string
            docs: The identity_persons RID of the prospective admin who submitted this request.
          taxonId:
            type: string
            docs: The selected religion_taxa RID (the congregation's tradition).
          congregationName: string
          countryId:
            type: string
            docs: The refdata_countries RID.
          adminArea1: optional<string>
          locality: optional<string>
          street: optional<string>
          houseNumber: optional<string>
          postalCode: optional<string>
          coordinate: Coordinate
          status: RegistrationStatus
          rejectionReason:
            type: optional<string>
            docs: Set only when status = REJECTED.
          decidedByPersonId:
            type: optional<string>
            docs: The operator who approved/rejected this request; unset while PENDING.
          decidedAt: optional<datetime>
          createdUnitId:
            type: optional<string>
            docs: >
              The directory_units RID createChildOrg produced. Set as soon as status = PROVISIONING
              (the one approval step that cannot be re-derived on a retry), and stays set through
              APPROVED.
          jurisdictionUnitId:
            type: optional<string>
            docs: >
              The directory_units RID the operator chose as this congregation's parent at approval
              time (D-JurisdictionUnits, M4.1) — a jurisdiction unit, or unset to fall back to the
              single shared root. A historical fact, not a live mirror of the current graph: if the
              congregation is later re-parented (reparentRequest), this field is NOT updated —
              ReparentingJob.newParentUnitId is the current source of truth for where it actually is.
          createdAt: datetime
          updatedAt: datetime
      ReparentingJob:
        docs: >
          Tracks one re-parenting attempt for an APPROVED request's congregation unit. At most one
          non-FAILED job may exist per congregation unit at a time (enforced by the store).
        fields:
          id:
            type: string
            docs: OpenFaithMap-local RID (openfaithmap.registration.reparentingJob).
          registrationRequestId: string
          congregationUnitId: string
          oldParentUnitId: string
          newParentUnitId: string
          status: ReparentStatus
          performedByPersonId: string
          error:
            type: optional<string>
            docs: Set only when status = FAILED.
          createdAt: datetime
          updatedAt: datetime
      SubmitRegistrationRequest:
        fields:
          taxonId: string
          congregationName: string
          countryId: string
          adminArea1: optional<string>
          locality: optional<string>
          street: optional<string>
          houseNumber: optional<string>
          postalCode: optional<string>
          coordinate: Coordinate
      ApproveRegistrationRequest:
        fields:
          unitCode:
            type: optional<string>
            docs: >
              Short, unique directory_units code. Defaults to a slug derived from
              congregationName + a short random suffix if omitted.
          jurisdictionUnitId:
            type: optional<string>
            docs: >
              The directory_units RID to create the congregation under (D-JurisdictionUnits,
              M4.1) — operator-chosen, never inferred from taxonId. Omitted = the current flat-root
              behavior, unchanged: the congregation is created directly under the configured root
              unit. On a resumed PROVISIONING retry, the ORIGINAL choice persisted at first approval
              is reused regardless of what this field carries on the retry call, exactly like
              unitCode's existing once-PROVISIONING-ignore-further-input discipline.
      RejectRegistrationRequest:
        fields:
          reason: string
      ReparentRegistrationRequest:
        fields:
          newParentUnitId:
            type: string
            docs: The jurisdiction (or root) unit to move this congregation's unit under.
      RegistrationRequestPage:
        fields:
          requests: list<RegistrationRequest>
          nextPageToken: optional<string>
    errors:
      RequestNotFound:
        namespace: Registration
        code: NOT_FOUND
        safe-args:
          requestId: string
      RequestNotPending:
        docs: The request has already been approved or rejected.
        namespace: Registration
        code: INVALID_ARGUMENT
        safe-args:
          requestId: string
          status: string
      TaxonExcluded:
        docs: >
          The selected tradition (or an ancestor) is on the named D-Exclusions list
          (architecture/decisions.md) — the platform never permits registration under it.
        namespace: Registration
        code: INVALID_ARGUMENT
        safe-args:
          taxonId: string
      TaxonNotFound:
        namespace: Registration
        code: INVALID_ARGUMENT
        safe-args:
          taxonId: string
      RequestNotApproved:
        docs: >
          reparentRequest was called on a request that isn't APPROVED — there is no created unit to
          move.
        namespace: Registration
        code: INVALID_ARGUMENT
        safe-args:
          requestId: string
          status: string
      Forbidden:
        docs: The caller does not hold religionorg.manage on the configured root unit (approveRequest, rejectRequest, reparentRequest, listRequests).
        namespace: Registration
        code: PERMISSION_DENIED
        safe-args: {}

services:
  RegistrationService:
    name: Registration Service
    package: openfaithmap.registration
    base-path: /registration/v1
    default-auth: header
    docs: >
      Congregation-registration requests: submit (any authenticated person), list/approve/reject
      (a registration operator — verified live against internal/authz's PDP, never cached).
      See docs/modules/registration.md.
    endpoints:
      submitRequest:
        http: POST /requests
        docs: >
          Submit a new registration request as the caller. Runs the D-Exclusions taxon check
          (walking the taxon's ancestors via internal/religion) before persisting —
          returns Registration:TaxonExcluded if the tradition (or an ancestor) is on the named
          exclusion list, Registration:TaxonNotFound if taxonId doesn't resolve.
        args:
          request: SubmitRegistrationRequest
        returns: RegistrationRequest
      listRequests:
        http: GET /requests
        docs: >
          List registration requests. Operator-only for now (verified live: does the caller hold
          religionorg.manage on the configured root unit?) — see open seams in
          docs/modules/registration.md for a submitter's-own-requests view.
        args:
          status:
            type: optional<string>
            param-type: query
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: RegistrationRequestPage
      getRequest:
        http: GET /requests/{requestId}
        docs: Read one request. The submitter or an operator (verified live) may read it.
        args:
          requestId:
            type: string
            param-type: path
        returns: RegistrationRequest
      approveRequest:
        http: POST /requests/{requestId}/approve
        docs: >
          Approve a PENDING request: performs the real in-process core writes (createChildOrg under
          the configured root unit, org classification, a site over a new location, a filled
          Position, and a unit-scoped role assignment granting the submitter authority over their
          new congregation) under the caller's own resolved subject — internal/authz's PDP decides
          for real if the caller lacks authority, returning Registration:Forbidden.
        args:
          requestId:
            type: string
            param-type: path
          request: ApproveRegistrationRequest
        returns: RegistrationRequest
      rejectRequest:
        http: POST /requests/{requestId}/reject
        docs: Reject a PENDING request with a reason. No core writes.
        args:
          requestId:
            type: string
            param-type: path
          request: RejectRegistrationRequest
        returns: RegistrationRequest
      reparentRequest:
        http: POST /requests/{requestId}/reparent
        docs: >
          Start or resume re-parenting an APPROVED request's congregation unit onto a different
          jurisdiction (or root) unit (D-JurisdictionUnits, M4.1). Idempotent: re-calling with the
          same requestId resumes the existing job from whichever ReparentStatus step last durably
          landed, rather than repeating completed steps. Operator-only (same root-unit-scoped check
          as approveRequest/listRequests), using the caller's own resolved subject for every
          directory write. Returns Registration:RequestNotApproved if the request was never
          approved.
        args:
          requestId:
            type: string
            param-type: path
          request: ReparentRegistrationRequest
        returns: ReparentingJob
      getReparentStatus:
        http: GET /requests/{requestId}/reparent
        docs: Read the most recent re-parenting job for this request, if one has ever been started.
        args:
          requestId:
            type: string
            param-type: path
        returns: optional<ReparentingJob>
