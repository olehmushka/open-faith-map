# Discovery module API (M4). docs/modules/discovery.md. A read-through cache over
# internal/religion's closure-aware discovery search (M10.6: in-process, no external service) —
# discovery_site_cache is disposable: rebuildable from internal/religion + content at any time.
#
# TWO services, same reasoning as content.conjure.yml (Conjure's auth is a fixed per-service
# choice, not runtime-conditional): openfaithmap-web holds no session at all (D-AdminSurface), so
# it can only ever call DiscoveryPublicService; DiscoveryService (the manual refresh tool) is
# openfaithmap-admin only.
#
# On a cache miss for the (tokenless) public caller, the server refreshes the cache in-request under
# authz.SystemContext() (D-InProcessAuthz amendment #5) calling internal/religion.SearchSites
# directly — no service principal, no forwarded token, since there isn't one for an anonymous
# caller. See discovery.md's redesign section.
#
# Generated Go lands in internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: openfaithmap.discovery
    objects:
      DiscoverySite:
        fields:
          id: string
          religionSiteRid:
            type: string
            docs: The religion_sites RID this row projects (opaque value).
          congregationUnitRid: string
          contentSiteId:
            type: optional<string>
            docs: Set once the congregation has published a site (content module) — nullable.
          latitude:
            type: optional<double>
            docs: Already public_precision-coarsened by internal/religion.Coarsen; null when precision is hidden.
          longitude: optional<double>
          traditionTaxonId: optional<string>
          serviceLanguages: list<string>
          serviceDays:
            type: list<integer>
            docs: 0=Sunday .. 6=Saturday, matching religion_service_schedules.day_of_week.
          refreshedAt: datetime
      SearchResult:
        fields:
          sites: list<DiscoverySite>
      RefreshRegionRequest:
        fields:
          minLat: double
          minLng: double
          maxLat: double
          maxLng: double
      RefreshResult:
        fields:
          refreshedCount: integer

    errors:
      Forbidden:
        docs: The caller does not hold the registration-operator's target-scoped grant on the root unit.
        namespace: Discovery
        code: PERMISSION_DENIED
        safe-args: {}

services:
  DiscoveryPublicService:
    name: Discovery Public Service
    package: openfaithmap.discovery
    base-path: /discovery/v1
    docs: >
      Anonymous public map/search (openfaithmap-web holds no session — D-AdminSurface). Never
      widens what internal/religion.SearchSites would already return publicly (the position-oracle
      fix: hidden sites excluded, others coordinate-snapped). See docs/modules/discovery.md.
    endpoints:
      search:
        http: GET /search
        args:
          lat:
            type: optional<double>
            param-type: query
          lng:
            type: optional<double>
            param-type: query
          radiusM:
            type: optional<double>
            param-type: query
          tradition:
            type: optional<string>
            param-type: query
            docs: A religion taxon code — matches the religion_taxa_closure.
          language:
            type: optional<string>
            param-type: query
          dayOfWeek:
            type: optional<integer>
            param-type: query
          query:
            type: optional<string>
            param-type: query
            docs: Fuzzy match on the congregation's name.
        returns: SearchResult

  DiscoveryService:
    name: Discovery Service
    package: openfaithmap.discovery
    base-path: /discovery/v1
    default-auth: header
    docs: >
      Operator tooling only — forcing a manual cache rebuild for a region. Not part of the public
      product surface; the public map never calls this.
    endpoints:
      refresh:
        http: POST /refresh
        args:
          request: RefreshRegionRequest
        returns: RefreshResult
