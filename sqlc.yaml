# sqlc configuration (docs/architecture/decisions.md's D-Stack: DB access = pgx + sqlc, the
# convention several store.go headers already flagged this repo as deviating from).
# Queries are authored as *.sql per module and compiled into typed Go in that module's adapters/.
# The schema is the repo-root Atlas migrations dir (single source of truth) — sqlc reads the same
# DDL Atlas applies. Generated code is never hand-edited.
#
# Every entry below points `schema:` at the FULL migrations dir, not a per-module slice — a
# conscious tradeoff, not an oversight (mirrors go-oikumenea's own sqlc.yaml, which its own
# docs/architecture/review-2026-07.md finding R-08 flags as generating the whole schema's types
# into every module's package). Several modules run legitimate cross-module JOINs today (authz
# joins directory_graphs and identity_persons; directory's ClosurePort assumes the full schema is
# visible) that a real per-module schema slice would either break or require duplicating table DDL
# against this repo's expand-only migration convention. Mitigation instead of elimination: each
# generated <module>sql package stays private to that module's own adapters/repository.go — never
# import it from application/service.go, domain/, or another module.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/refdata/adapters/queries
    gen:
      go:
        package: refdatasql
        out: internal/refdata/adapters/refdatasql
        sql_package: pgx/v5
        emit_methods_with_db_argument: false
        emit_exact_table_names: false
        overrides: &overrides
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # Non-nullable timestamptz -> time.Time directly (matches every hand-written store's own
          # scan target). Nullable timestamptz deliberately keeps sqlc's default pgtype.Timestamptz —
          # overriding it to *time.Time here double-wraps into **time.Time (a known sqlc quirk: a
          # pointer go_type on a nullable-column rule gets wrapped again). Repository mappers convert
          # via db.NullableTime instead (internal/platform/db/dbtx.go).
          - db_type: "timestamptz"
            go_type: "time.Time"
  - engine: postgresql
    schema: migrations
    queries: internal/location/adapters/queries
    gen:
      go:
        package: locationsql
        out: internal/location/adapters/locationsql
        sql_package: pgx/v5
        emit_methods_with_db_argument: false
        emit_exact_table_names: false
        overrides: *overrides
