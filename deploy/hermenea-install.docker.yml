# Install config for go-oikumenea's own hermenea companion (M2.2, D-BulkImport), adapted for THIS
# repo's docker-compose.yml. Lives here (not in go-oikumenea's own repo) because it's OpenFaithMap's
# deployment concern — mirrors the pattern deploy/oikumenea-install.yml already uses. Adapted from
# go-oikumenea's own deploy/hermenea-install.docker.yml with one substantive change: oikumenea's
# base-url below points at THIS repo's service name (oikumenea-app), not go-oikumenea's own (app).
# Mounted over /app/var/conf/hermenea-install.yml in the hermenea container. The DSN points at the
# compose `postgres` service's SEPARATE `hermenea` database; the loader calls oikumenea's public API
# at the in-network `oikumenea-app` service. INSECURE local defaults — replace for any real
# deployment, and supply the two shared secrets (HERMENEA_OIKUMENEA_TOKEN / OIKUMENEA_HERMENEA_TOKEN)
# as env vars (already set on the hermenea/oikumenea-app services in docker-compose.yml), never in
# this file. See docs/modules/import.md for what hermenea actually is and how OpenFaithMap uses it.
product-name: hermenea
product-version: 0.0.0-dev
use-console-log: true
server:
  address: "0.0.0.0"
  port: 9443
  management-port: 9444
  context-path: ""

# Hermenea's OWN database (separate from oikumenea's `oikumenea` schema and OpenFaithMap's own
# `openfaithmap` schema — a third, unrelated isolation axis, go-oikumenea's own design), created +
# migrated by the migrate-hermenea compose step.
postgres:
  dsn: "postgres://postgres:postgres@postgres:5432/hermenea?sslmode=disable"

# oikumenea's public API the loader posts to (POST /import/{objectType}). oikumenea-app serves
# self-signed TLS in this stack (D-HeadlessTopology), so skip verification (dev only).
oikumenea:
  base-url: "https://oikumenea-app:8443"
  insecure-skip-verify: true
  # chunked runs: records per import envelope/transaction (default 5000) and the loader's per-request
  # deadline (default 120000 ms).
  # chunk-size: 5000
  # http-timeout-ms: 120000

# Declarative import sources seeded at boot (idempotent), copied from go-oikumenea's own reference
# example. The bundled ISO-3166 file source is network-free and covers the "countries" case
# directly; the language/external-org sources make live outbound calls on their cron schedule by
# default (docs/modules/import.md's open seams flags this explicitly — a deliberate default to
# carry over, not a silent choice). The WOF places source is disabled (a large download).
sources:
  - code: geo-countries-iso3166
    name: "ISO-3166 countries (bundled)"
    connector-type: file
    object-type: geo-countries
    locator: "deploy/geo-presets/iso-3166.json"
    cron: "@weekly"
    enabled: true
  # Languages — live from upstream master via the http-files streaming connector, transformed in Go.
  # language-scheme MUST precede language-scripts.
  - code: glottolog-languoids
    name: "Glottolog languoids (live CLDF master)"
    connector-type: http-files
    object-type: language-scheme
    locator: >-
      https://raw.githubusercontent.com/glottolog/glottolog-cldf/master/cldf/languages.csv
      https://raw.githubusercontent.com/glottolog/glottolog-cldf/master/cldf/values.csv
    cron: "@weekly"
    enabled: true
  - code: cldr-language-scripts
    name: "CLDR language→script links (live)"
    connector-type: http-files
    object-type: language-scripts
    locator: >-
      https://raw.githubusercontent.com/unicode-org/cldr/main/common/supplemental/supplementalData.xml
      https://iso639-3.sil.org/sites/iso639-3/files/downloads/iso-639-3.tab
    cron: "@weekly"
    enabled: true
  - code: wof-geo-ua
    name: "Who's On First — Ukraine (admin)"
    connector-type: wof-sqlite
    object-type: geo-places
    locator: "https://data.geocode.earth/wof/dist/sqlite/whosonfirst-data-admin-ua-latest.db.bz2"
    cron: "@weekly"
    enabled: false
  # External organizations — live from the Wikidata SPARQL endpoint via the http connector. A
  # LIMIT-bounded query of Ukrainian political parties + government bodies so a live run is fast.
  # The geo-countries source SHOULD load first so the country FK resolves.
  - code: wikidata-orgs-ua
    name: "Wikidata external orgs — Ukraine (parties + government)"
    connector-type: http
    object-type: external-organizations
    locator: "https://query.wikidata.org/sparql?format=json&query=SELECT%20%3Forg%20%3ForgLabel%20%3FcountryCode%20%3Fkind%20WHERE%20%7B%0A%20%20VALUES%20%28%3Fclass%20%3Fkind%29%20%7B%0A%20%20%20%20%28wd%3AQ7278%20%22party%22%29%0A%20%20%20%20%28wd%3AQ2659904%20%22government_body%22%29%0A%20%20%7D%0A%20%20%3Forg%20wdt%3AP31%20%3Fclass%20.%0A%20%20%3Forg%20wdt%3AP17%20wd%3AQ212%20.%0A%20%20OPTIONAL%20%7B%20%3Forg%20wdt%3AP17%20%3Fc%20.%20%3Fc%20wdt%3AP297%20%3FcountryCode%20.%20%7D%0A%20%20SERVICE%20wikibase%3Alabel%20%7B%20bd%3AserviceParam%20wikibase%3Alanguage%20%22en%2Cuk%22.%20%7D%0A%7D%0ALIMIT%2080"
    cron: "@weekly"
    enabled: true

worker:
  # concurrency: 4         # parallel worker goroutines over the SKIP LOCKED queue (default 1)
  poll-interval-ms: 2000
  schedule-tick-ms: 30000
  backoff-base-ms: 5000
  backoff-max-ms: 300000
  job-timeout-ms: 600000   # 10 min — the live language-scheme load (download + transform + upsert)
  stale-after-ms: 660000   # > job-timeout so a long legit job is not requeued
