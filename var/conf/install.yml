# Local-dev install configuration (plaintext; ECV-encrypted in real deployments).
product-name: openfaithmap-api
product-version: 0.0.0-dev
use-console-log: true
# GuardSymmetricIssuers' only input (M10.2, D-DirectTokenVerification's amendment): local | dev |
# staging | prod. Any value other than local/dev refuses HS256 issuers at boot. Never derive
# dev-ness from a secret's presence — set this explicitly per deployment.
environment: local
server:
  address: "0.0.0.0"
  # 3000/3001, not go-oikumenea's own 8443/8444 default — oikumenea-app occupies those on the
  # compose network, so openfaithmap-api takes the 300x range that openfaithmap-web (3002),
  # oikumenea-console (3003), and openfaithmap-admin (3004) continue.
  #
  # (This comment previously justified the choice by a collision with go-oikumenea's dev Keycloak
  # on 8080. There is no Keycloak in this stack — Google is the sole IdP, D-GoogleDirect. The port
  # choice stands; the reason given for it did not.)
  port: 3000
  management-port: 3001
  context-path: ""
