# Local stack (docs/architecture/overview.md's deployment topology; M1, D-CoreDependency).
#
# ONE shared Postgres instance for both go-oikumenea and OpenFaithMap, separated by SCHEMA
# (`oikumenea` vs `openfaithmap` — conventions.md already named these as schemas, one level down in
# each project's own database; running them as two schemas in the same database rather than two
# separate database instances is a simplification for local dev, decided over chat, not yet written
# up as its own D-<Name> in architecture/decisions.md). Still no cross-schema FKs (conventions.md) —
# OpenFaithMap's tables still only ever store a go-oikumenea RID as an opaque TEXT foreign value.
#
# go-oikumenea's own four-service bootstrap sequence (postgres / oikumenea-migrate /
# oikumenea-init-role / oikumenea-app), reused from its own docker-compose.yml shape, image pulled
# from its published registry (docker.io/olegamysk/oikumenea) rather than built from source.
# `oikumenea-app` publishes NO host port (D-HeadlessTopology) — reachable only from other containers
# on this network; openfaithmap-api reaches it at https://oikumenea-app:8443.
#
# No Keycloak: OpenFaithMap authenticates directly against Google (see deploy/oikumenea-install.yml's
# header comment for the full rationale and how the service-principal bootstrap works without a
# browser-based OAuth flow). This deviates from architecture/decisions.md's original shared-Keycloak
# sketch — that doc still needs an update pass to record the change as a real D-<Name> decision.
#
# go-oikumenea's migrations aren't published as a standalone artifact yet, so oikumenea-migrate reads
# them from a sibling checkout of the go-oikumenea repo (OIKUMENEA_SRC, default ../go-oikumenea) —
# make sure its migrations/ matches the image tag below. The same sibling checkout is now also used
# for hermenea (M2.2, D-BulkImport) — go-oikumenea's own reference-data companion service, which has
# no published image, so it's built from OIKUMENEA_SRC's Dockerfile.hermenea, and its own migration
# set is read from OIKUMENEA_SRC's migrations/hermenea/. See docs/modules/import.md.
#
#   OIKUMENEA_SRC=/path/to/go-oikumenea docker compose up --build

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- go-oikumenea (D-CoreDependency) ---
  # --allow-dirty (here and on openfaithmap-migrate below): NOT about the two schemas sharing one
  # database (M2.4 checked — each already has its own --revisions-schema, and that alone isn't why).
  # Verified against a genuinely fresh volume: the postgis/postgis image itself bootstraps a `tiger`
  # schema before any migration ever runs, and Atlas's dirty-check flags that regardless of
  # --revisions-schema. Permanent, not a M2.1-era leftover to clean up later.
  oikumenea-migrate:
    image: arigaio/atlas:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      migrate apply --allow-dirty
      --url "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      --dir "file:///migrations"
      --revisions-schema oikumenea
    volumes:
      - ${OIKUMENEA_SRC:-../go-oikumenea}/migrations:/migrations:ro

  oikumenea-init-role:
    image: postgres:16
    depends_on:
      oikumenea-migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -c "
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'oikumenea') THEN
              CREATE ROLE oikumenea LOGIN PASSWORD 'dev' IN ROLE oikumenea_app;
            END IF;
          END \$\$;"

  oikumenea-app:
    # 0.0.4 fixes go-oikumenea#36: tenant_units RLS was structurally unsatisfiable at a new unit's
    # first INSERT for any person-shaped, non-admin caller (CreateChildOrg inserted the unit before
    # tenant_unit_closure was seeded, so the person-arm RLS predicate could never pass). Fixed by
    # seeding closure before the INSERT. Re-verify live after bumping.
    image: docker.io/olegamysk/oikumenea:0.0.4
    depends_on:
      oikumenea-init-role:
        condition: service_completed_successfully
    volumes:
      - ./deploy/oikumenea-install.yml:/app/var/conf/install.yml:ro
    environment:
      # Two trust directions, two secrets (M2.2, D-BulkImport). HERMENEA_OIKUMENEA_TOKEN is the
      # bearer go-oikumenea requires on inbound POST /import/{objectType} calls from hermenea
      # (authenticates the hermenea-importer service principal, import.manage only).
      # OIKUMENEA_HERMENEA_TOKEN is what go-oikumenea presents outbound when proxying a
      # UI-triggered sync call to hermenea's own control API. Read as env-var overlays only (no
      # install-config field) — see go-oikumenea's internal/platform/config's Hermenea struct.
      # Values come from .env (see .env.example) — INSECURE local-dev defaults there, matching
      # go-oikumenea's own docker-compose.yml literally so both repos interoperate out of the box;
      # replace for any real deployment.
      HERMENEA_OIKUMENEA_TOKEN: "${HERMENEA_OIKUMENEA_TOKEN}"
      OIKUMENEA_HERMENEA_TOKEN: "${OIKUMENEA_HERMENEA_TOKEN}"
    # No published ports (D-HeadlessTopology) — internal-only, reached by openfaithmap-api over the
    # compose network at https://oikumenea-app:8443.

  # hermenea (M2.2, D-BulkImport) — go-oikumenea's own reference-data companion service, deployed
  # unmodified, not built by OpenFaithMap (docs/modules/import.md). Owns a SEPARATE Postgres
  # database (named `hermenea`, not a schema inside `oikumenea`/`openfaithmap`) with its own
  # migration set. No published image exists, so it's built from the same OIKUMENEA_SRC sibling
  # checkout oikumenea-migrate already uses, via that checkout's Dockerfile.hermenea.
  init-hermenea-db:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -tc \
          "SELECT 1 FROM pg_database WHERE datname='hermenea'" | grep -q 1 || \
        psql "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -c \
          "CREATE DATABASE hermenea;"

  migrate-hermenea:
    image: arigaio/atlas:latest
    depends_on:
      init-hermenea-db:
        condition: service_completed_successfully
    command: >-
      migrate apply
      --url "postgres://postgres:postgres@postgres:5432/hermenea?sslmode=disable"
      --dir "file:///migrations"
      --revisions-schema hermenea
    volumes:
      - ${OIKUMENEA_SRC:-../go-oikumenea}/migrations/hermenea:/migrations:ro

  hermenea:
    build:
      context: ${OIKUMENEA_SRC:-../go-oikumenea}
      dockerfile: Dockerfile.hermenea
    command: ["serve"]
    depends_on:
      migrate-hermenea:
        condition: service_completed_successfully
      oikumenea-app:
        condition: service_started
    volumes:
      - ./deploy/hermenea-install.docker.yml:/app/var/conf/hermenea-install.yml:ro
    environment:
      # Same two secrets as oikumenea-app above (M2.2, D-BulkImport) — values from .env.
      HERMENEA_OIKUMENEA_TOKEN: "${HERMENEA_OIKUMENEA_TOKEN}"
      OIKUMENEA_HERMENEA_TOKEN: "${OIKUMENEA_HERMENEA_TOKEN}"
    # Lets an enabled source point at a dist served from the host (e.g. a local test fixture) —
    # inert unless such a source is enabled in deploy/hermenea-install.docker.yml.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Published directly, unlike oikumenea-app's D-HeadlessTopology no-port rule: hermenea holds no
    # OpenFaithMap-sensitive data of its own, and local dev triggers it from the host
    # (docs/modules/import.md's "Operating hermenea" curl example targets localhost:9443).
    ports:
      - "9443:9443"
      - "9444:9444"

  # --- OpenFaithMap's own services ---
  openfaithmap-migrate:
    image: arigaio/atlas:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      migrate apply --allow-dirty
      --url "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      --dir "file:///migrations"
      --revisions-schema openfaithmap
    volumes:
      - ./migrations:/migrations:ro

  # M2.4, D-SharedDatabase: mirrors oikumenea-init-role above — creates the LOGIN role
  # openfaithmap-api actually connects as, a member of migration 0003's openfaithmap_app group role.
  # A role with a password has no business being version-controlled Atlas DDL.
  openfaithmap-init-role:
    image: postgres:16
    depends_on:
      openfaithmap-migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -c "
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openfaithmap') THEN
              CREATE ROLE openfaithmap LOGIN PASSWORD 'dev' IN ROLE openfaithmap_app;
            END IF;
          END \$\$;"

  openfaithmap-api:
    build: .
    # 3000 (the app port) is NOT published (M2.4): openfaithmap-admin is the only caller and reaches
    # it internally at https://openfaithmap-api:3000, same D-HeadlessTopology rule oikumenea-app
    # already follows — this service accepts and forwards bearer tokens, so it has no business being
    # host-reachable. 3001 (witchcraft's management/health port, no auth) stays published for local
    # debugging (curl localhost:3001/status/liveness).
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      openfaithmap-migrate:
        condition: service_completed_successfully
      openfaithmap-init-role:
        condition: service_completed_successfully
      oikumenea-app:
        condition: service_started
    environment:
      # M2.4, D-SharedDatabase: the least-privilege role above, not the postgres superuser — has no
      # grant of any kind on the oikumenea schema (verify: SELECT against oikumenea.* from inside this
      # container fails with a permission error).
      DATABASE_URL: "postgres://openfaithmap:dev@postgres:5432/postgres?sslmode=disable"
      OIKUMENEA_BASE_URL: "https://oikumenea-app:8443"
      # oikumenea-app serves a self-signed cert in local dev (D-HeadlessTopology). DEV ONLY.
      OIKUMENEA_INSECURE_SKIP_VERIFY: "true"
      # M2 registration module — the single shared root unit + the role granted to a newly approved
      # congregation admin, both produced by scripts/bootstrap-registration-org. Instance-specific
      # RIDs, not committed elsewhere — set per environment.
      REGISTRATION_ROOT_UNIT_ID: "${REGISTRATION_ROOT_UNIT_ID}"
      REGISTRATION_CONGREGATION_ADMIN_ROLE_ID: "${REGISTRATION_CONGREGATION_ADMIN_ROLE_ID}"
      # M4, discovery: the service principal's own credentials — first production use of
      # coreintegration.NewServiceClient (M1 built it, only an integration test called it until
      # now). Same GOOGLE_APPLICATION_CREDENTIALS convention scripts/bootstrap-service-principal
      # already uses on the host (.env.example); this container needs its own copy mounted in to
      # mint Google ID tokens for GET /search's cache-miss fallback.
      GOOGLE_APPLICATION_CREDENTIALS: "/app/var/service-account.json"
      # congregationimport (D-CongregationImport, docs/modules/congregationimport.md): optional —
      # the ЄДР connector only registers if this is set. Real weekly bulk download is an operator's
      # own out-of-band step (data.gov.ua dataset 03cc1239-3988-4451-aa0d-aadb77448714, resource
      # uo.zip); mount it in with an extra `volumes:` entry when actually using this connector, same
      # shape as GOOGLE_APPLICATION_CREDENTIALS above. Left unset here — no file is bundled or
      # auto-downloaded by this compose file.
      UAEDR_UO_FILE_PATH: "${UAEDR_UO_FILE_PATH:-}"
    volumes:
      # The leading "./" is load-bearing: Compose treats a bare relative path as a named-volume
      # reference, not a bind mount, and fails with "undefined volume" otherwise — found by
      # actually running `docker compose ps`, not by review.
      - "./${GOOGLE_APPLICATION_CREDENTIALS}:/app/var/service-account.json:ro"

  # openfaithmap-web (M2.1, D-AdminSurface; M4 adds its first real data-reading pages) — the
  # anonymous public surface. Holds no session, no Auth.js, no credential of any kind
  # (docs/modules/web-facade.md) — every call below is unauthenticated, no bearer token attached.
  openfaithmap-web:
    build:
      context: ./web/apps/web
    depends_on:
      openfaithmap-api:
        condition: service_started
    ports:
      - "3002:3000"
    environment:
      # openfaithmap-api (M4: discovery + content public reads) — reached over the compose
      # network, self-signed cert in local dev (D-HeadlessTopology). Never oikumenea-app directly
      # — this app has no token to forward and every religion read 401s an anonymous caller (M2.5).
      OPENFAITHMAP_API_BASE_URL: "https://openfaithmap-api:3000"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

  # openfaithmap-admin (M2.1, D-AdminSurface) — the only surface that ever holds a session: the
  # registration wizard, operator-approval console, congregation-admin console, moderator console
  # (docs/modules/web-admin.md). Forwards the logged-in user's Google ID token as the bearer on
  # every go-oikumenea / openfaithmap-api call (no Keycloak — docs/architecture/decisions.md's
  # D-CoreDependency).
  openfaithmap-admin:
    build:
      context: ./web/apps/admin
    depends_on:
      oikumenea-app:
        condition: service_started
      openfaithmap-api:
        condition: service_started
    ports:
      - "3004:3000"
    environment:
      OIKUMENEA_BASE_URL: "https://oikumenea-app:8443"
      # openfaithmap-api (M2) — reached over the compose network, same self-signed-cert caveat.
      OPENFAITHMAP_API_BASE_URL: "https://openfaithmap-api:3000"
      # oikumenea-app / openfaithmap-api both serve self-signed certs in local dev (D-HeadlessTopology). DEV ONLY.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      AUTH_SECRET: "${OPENFAITHMAP_ADMIN_AUTH_SECRET}"
      AUTH_URL: "http://localhost:3004"
      AUTH_TRUST_HOST: "true"
      # Non-secret: matches the audience deploy/oikumenea-install.yml's Google issuer entry pins.
      # Reuses the same Google OAuth client oikumenea-console already uses — needs
      # http://localhost:3004/api/auth/callback/google added as an authorized redirect URI on that
      # client in Google Cloud Console (external step, same treatment M1.2 gave oikumenea-console).
      AUTH_GOOGLE_ID: "459963198200-qlhu1um4h9bik68608c73o671rcqv4je.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET}"
      # M4.1, D-JurisdictionUnits: the JurisdictionPicker calls go-oikumenea's Tenant/Religion
      # services directly (no new openfaithmap-api endpoint for browsing/creating jurisdiction
      # units), so it needs the same root unit id openfaithmap-api's own Config.RootUnitID carries —
      # scripts/bootstrap-registration-org's output, duplicated here rather than fetched from the
      # backend (there is no config-echo endpoint, and adding one for a single id felt like more new
      # API surface than the value justified).
      REGISTRATION_ROOT_UNIT_ID: "${REGISTRATION_ROOT_UNIT_ID}"

  # oikumenea-console (M1.2, D-InstanceAdminConsole) — go-oikumenea's own published admin console,
  # reused unmodified. Super-admin-only: manages the religion_taxa catalog, tenant/org structure
  # instance-wide, service-principal registration, and other instance admins — nothing
  # OpenFaithMap-specific. Reaches oikumenea-app the same way openfaithmap-api does (compose-internal
  # network, self-signed cert). Published on a normal host port for local dev only — a real
  # deployment restricts this behind a WireGuard VPN instead (decided, not yet implemented — see
  # D-InstanceAdminConsole's consequences in docs/architecture/decisions.md).
  oikumenea-console:
    image: docker.io/olegamysk/oikumenea-console:0.0.1
    depends_on:
      oikumenea-app:
        condition: service_started
    ports:
      - "3003:3000"
    environment:
      API_BASE_URL: "https://oikumenea-app:8443"
      # oikumenea-app serves a self-signed cert in local dev (D-HeadlessTopology). DEV ONLY.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # Auth.js session secret — DISTINCT from openfaithmap-admin's OPENFAITHMAP_ADMIN_AUTH_SECRET
      # above (two independent sessions). See .env.example.
      AUTH_SECRET: "${OIKUMENEA_CONSOLE_AUTH_SECRET}"
      AUTH_URL: "http://localhost:3003"
      AUTH_TRUST_HOST: "true"
      # Reuses the same shared Google OAuth client openfaithmap-admin uses (same client id/secret)
      # rather than provisioning a new one or reintroducing Keycloak — deploy/oikumenea-install.yml's
      # Google issuer entry already trusts this audience, so no install-config change is needed.
      # Manual, out-of-repo step required: add http://localhost:3003/api/auth/callback/google as an
      # authorized redirect URI on that same Google Cloud OAuth client.
      AUTH_GOOGLE_ID: "459963198200-qlhu1um4h9bik68608c73o671rcqv4je.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET}"

volumes:
  postgres-data:
