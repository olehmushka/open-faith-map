# Local stack (docs/architecture/overview.md's deployment topology). Everything here is
# OpenFaithMap's own — M10 (D-OwnCore) absorbed go-oikumenea's core into openfaithmap-api as
# in-process Go modules and M10.8 tore down the separate go-oikumenea/hermenea/oikumenea-console
# stack this file used to run alongside it (a full sibling-repo checkout, a second Postgres schema,
# a second published-image service, a reference-data companion service, and a third UI surface —
# all deleted, not replaced). One Postgres instance, one schema (`openfaithmap`).

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfaithmap-migrate:
    image: arigaio/atlas:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      migrate apply --allow-dirty
      --url "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      --dir "file:///migrations"
      --revisions-schema openfaithmap
    volumes:
      - ./migrations:/migrations:ro

  # M2.4, D-SharedDatabase: creates the LOGIN role openfaithmap-api actually connects as, a member of
  # migration 0003's openfaithmap_app group role. A role with a password has no business being
  # version-controlled Atlas DDL. --allow-dirty above: NOT about a second schema sharing this database
  # (that's gone now) — verified against a genuinely fresh volume, the postgis/postgis image itself
  # bootstraps a `tiger` schema before any migration ever runs, and Atlas's dirty-check flags that
  # regardless of --revisions-schema. Permanent, not a leftover to clean up later.
  openfaithmap-init-role:
    image: postgres:16
    depends_on:
      openfaithmap-migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -c "
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openfaithmap') THEN
              CREATE ROLE openfaithmap LOGIN PASSWORD 'dev' IN ROLE openfaithmap_app;
            END IF;
          END \$\$;"

  openfaithmap-api:
    build: .
    # 3000 (the app port) is NOT published (M2.4): openfaithmap-admin is the only caller and reaches
    # it internally at https://openfaithmap-api:3000 (D-HeadlessTopology) — this service accepts and
    # forwards bearer tokens, so it has no business being host-reachable. 3001 (witchcraft's
    # management/health port, no auth) stays published for local debugging
    # (curl localhost:3001/status/liveness).
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      openfaithmap-migrate:
        condition: service_completed_successfully
      openfaithmap-init-role:
        condition: service_completed_successfully
    environment:
      # M2.4, D-SharedDatabase: the least-privilege role above, not the postgres superuser.
      DATABASE_URL: "postgres://openfaithmap:dev@postgres:5432/postgres?sslmode=disable"
      # M10.2 (D-DirectTokenVerification): the audience GuardIssuerAudience requires be pinned on
      # the Google OIDC issuer. Same client id openfaithmap-admin's own AUTH_GOOGLE_ID already uses
      # below (one Google OAuth client, two relying parties) — a token minted for this client is
      # what both the admin app's sign-in flow and this service's own validator must agree on.
      GOOGLE_OAUTH_CLIENT_ID: "459963198200-qlhu1um4h9bik68608c73o671rcqv4je.apps.googleusercontent.com"
      # DEV_ISSUER_HMAC_KEY: intentionally unset here. GuardSymmetricIssuers only permits an HS256
      # issuer in local/dev, but the guard is not why this stays empty — ship it commented out,
      # never with a value (D-DirectTokenVerification's amendment), so a copied compose override
      # can't accidentally carry a real secret into a non-dev environment.
      # DEV_ISSUER_HMAC_KEY: ""
      # BOOTSTRAP_ADMIN_*: the M10.2 middleware's first-admin boot seed (D-SeedBootstrap). Unset here
      # by default — ValidateSeedForEnvironment treats an unset seed in local/dev as "nothing to
      # seed" and boot proceeds normally. Set these (via .env) to seed the first instance admin on a
      # fresh volume.
      BOOTSTRAP_ADMIN_ISSUER: "${BOOTSTRAP_ADMIN_ISSUER:-}"
      BOOTSTRAP_ADMIN_SUBJECT: "${BOOTSTRAP_ADMIN_SUBJECT:-}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_DISPLAY_NAME: "${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}"
      # IDENTITY_JIT_*: D-JIT link-on-match (internal/identity/middleware/validator.go's Config).
      # Existed in Go since M10.2 but was never wired through compose until now (a real gap — JIT was
      # unconditionally disabled in this stack no matter what .env set). Unset by default, same
      # posture as BOOTSTRAP_ADMIN_* above; set IDENTITY_JIT_ENABLED=true plus CLAIM=email/
      # MATCH=account-email to let a first real login link onto a bootstrap-seeded person by verified
      # email instead of only an exact pre-linked (issuer, subject).
      IDENTITY_JIT_ENABLED: "${IDENTITY_JIT_ENABLED:-}"
      IDENTITY_JIT_CLAIM: "${IDENTITY_JIT_CLAIM:-}"
      IDENTITY_JIT_MATCH: "${IDENTITY_JIT_MATCH:-}"
      # congregationimport (D-CongregationImport, docs/modules/congregationimport.md): optional —
      # the ЄДР connector only registers if one of these is set. Real weekly bulk download is an
      # operator's own out-of-band step (data.gov.ua dataset 03cc1239-3988-4451-aa0d-aadb77448714,
      # resource uo.zip); UAEDR_UO_FILE_PATH needs an extra `volumes:` entry when actually used, same
      # shape as any bind-mounted credential — UAEDR_SOURCE_URL needs no mount at all. Both left
      # unset here — no file is bundled or auto-downloaded by this compose file.
      UAEDR_UO_FILE_PATH: "${UAEDR_UO_FILE_PATH:-}"
      UAEDR_SOURCE_URL: "${UAEDR_SOURCE_URL:-}"
      # ar-rnc (Argentina's Registro Nacional de Cultos) — same optional pattern as ua-edr above.
      ARRNC_FILE_PATH: "${ARRNC_FILE_PATH:-}"
      ARRNC_SOURCE_URL: "${ARRNC_SOURCE_URL:-}"
      # osm (OpenStreetMap, Overpass API) — optional, gated on OSM_COUNTRY_CODES (a comma-separated
      # ISO 3166-1 alpha-2 list, e.g. "UY,PY,CO,CL"); OSM_OVERPASS_BASE_URL has a real code default
      # (overpass.kumi.systems) so it's only set here when overriding it. No volumes entry needed —
      # this connector only ever calls out over HTTP, never reads a local file.
      OSM_COUNTRY_CODES: "${OSM_COUNTRY_CODES:-}"
      OSM_OVERPASS_BASE_URL: "${OSM_OVERPASS_BASE_URL:-}"
      # wikidata-catholic (D-CatholicJurisdictionSync, docs/architecture/decisions.md) — optional,
      # only registers once CATHOLIC_JURISDICTION_ANCHOR_UNIT_ID is set (a real Unit an operator must
      # create ONCE, out-of-band, through the admin "Create unit" modal — this connector never
      # creates or touches anything above or outside that unit's own subtree).
      # CATHOLIC_JURISDICTION_COUNTRY_QIDS optionally scopes the sync to specific Wikidata country
      # QIDs (e.g. "Q212" for Ukraine); empty means every country worldwide.
      CATHOLIC_JURISDICTION_ANCHOR_UNIT_ID: "${CATHOLIC_JURISDICTION_ANCHOR_UNIT_ID:-}"
      CATHOLIC_JURISDICTION_COUNTRY_QIDS: "${CATHOLIC_JURISDICTION_COUNTRY_QIDS:-}"
      CATHOLIC_JURISDICTION_WIKIDATA_BASE_URL: "${CATHOLIC_JURISDICTION_WIKIDATA_BASE_URL:-}"

  # openfaithmap-web (M2.1, D-AdminSurface; M4 adds its first real data-reading pages) — the
  # anonymous public surface. Holds no session, no Auth.js, no credential of any kind
  # (docs/modules/web-facade.md) — every call below is unauthenticated, no bearer token attached.
  openfaithmap-web:
    build:
      context: ./web/apps/web
    depends_on:
      openfaithmap-api:
        condition: service_started
    ports:
      - "3002:3000"
    environment:
      # openfaithmap-api (M4: discovery + content public reads) — reached over the compose
      # network, self-signed cert in local dev (D-HeadlessTopology). Every religion read 401s an
      # anonymous caller unless it's on the anonymous allowlist (M2.5, M10.6).
      OPENFAITHMAP_API_BASE_URL: "https://openfaithmap-api:3000"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

  # openfaithmap-admin (M2.1, D-AdminSurface) — the only surface that ever holds a session: the
  # registration wizard, operator-approval console, congregation-admin console, moderator console,
  # and (M10.8, D-SuperAdminFold) the super-admin screens (docs/modules/web-admin.md). Forwards the
  # logged-in user's Google ID token as the bearer on every openfaithmap-api call.
  openfaithmap-admin:
    build:
      context: ./web/apps/admin
    depends_on:
      openfaithmap-api:
        condition: service_started
    ports:
      - "3004:3000"
    environment:
      # openfaithmap-api (M2) — reached over the compose network, same self-signed-cert caveat.
      OPENFAITHMAP_API_BASE_URL: "https://openfaithmap-api:3000"
      # openfaithmap-api serves a self-signed cert in local dev (D-HeadlessTopology). DEV ONLY.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      AUTH_SECRET: "${OPENFAITHMAP_ADMIN_AUTH_SECRET}"
      AUTH_URL: "http://localhost:3004"
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: "459963198200-qlhu1um4h9bik68608c73o671rcqv4je.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET}"
      # M4.1, D-JurisdictionUnits: congregation-import/page.tsx, registrations/page.tsx, and
      # registrations/reparent/page.tsx each read this directly as their own jurisdiction-picker
      # root. Non-secret: internal/platform/seed.RootUnitID, the fixed structural RID
      # migrations/0022_core_seed.sql seeds — this repo's own root unit, not go-oikumenea's (M10.6
      # cut the API side over; M10.7 confirmed the frontend still needs its own copy since there's
      # no config-echo endpoint and adding one for a single id isn't worth new API surface).
      REGISTRATION_ROOT_UNIT_ID: "${REGISTRATION_ROOT_UNIT_ID}"

volumes:
  postgres-data:
